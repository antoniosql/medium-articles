bundle:
  name: databricks-quality-delivery-demo

variables:
  catalog:
    description: Unity Catalog catalog name
    default: main
  schema:
    description: Target schema name
    default: demo_quality
  workspace_host:
    description: Databricks workspace host
    default: https://your-workspace.cloud.databricks.com

targets:
  dev:
    default: true
    mode: development
    workspace:
      host: ${var.workspace_host}

  staging:
    workspace:
      host: ${var.workspace_host}
    run_as:
      service_principal_name: 11111111-1111-1111-1111-111111111111

  prod:
    mode: production
    git:
      branch: main
    workspace:
      host: ${var.workspace_host}
    run_as:
      service_principal_name: 22222222-2222-2222-2222-222222222222
