name: ci

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate contracts
        run: agent-manager validate

      - name: Run Python tests
        run: python -m pytest -q

      - name: Run normal governed demo
        run: agent-manager demo

      - name: Confirm guardrail failure scenario
        run: agent-manager demo --scenario unmapped_category
