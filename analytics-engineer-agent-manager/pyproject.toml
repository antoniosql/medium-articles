[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "analytics-engineer-agent-manager"
version = "0.1.0"
description = "A governed agent workflow for analytics engineering with dbt and DuckDB"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Antonio Soto"}
]
dependencies = [
  "PyYAML>=6.0,<7.0",
  "dbt-duckdb>=1.10.1,<2.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<10.0",
  "ruff>=0.9,<1.0"
]
llm = [
  "openai>=2.0,<3.0",
  "pydantic>=2.8,<3.0"
]

[project.scripts]
agent-manager = "agent_manager.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
