[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "microsoft-decision-1-foundry"
version = "0.1.0"
description = "Ticket triage and brand guardrails with Microsoft-Decision-1 in Microsoft Foundry"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Antonio Soto"}
]
dependencies = [
  "azure-identity>=1.17,<2.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<10.0",
  "ruff>=0.9,<1.0"
]

[project.scripts]
decision-demo = "frasohome_decision.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
